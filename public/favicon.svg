<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DualDev">
  <!-- DualDev monogram: a bold D on the brand's near-black tile, filled with
       the green-to-orange brand ramp. Geometry only (no text), so it renders
       identically everywhere, and a single solid shape so it still reads as a
       "D" at 16px in a browser tab. -->
  <defs>
    <linearGradient id="dd" x1="16" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00FF85"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <path fill="url(#dd)" fill-rule="evenodd"
        d="M19 14 H33 a18 18 0 0 1 0 36 H19 Z M28 23 V41 H33 a9 9 0 0 0 0 -18 Z"/>
</svg>
